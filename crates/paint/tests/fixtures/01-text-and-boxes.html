<!doctype html>
<html>
<head>
<style>
  body { margin: 16px; font-family: sans-serif; font-size: 16px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  .box { background: #ddeeff; border: 2px solid #3366cc; padding: 8px; margin: 8px 0; border-radius: 6px; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; background: #eee; padding: 4px; text-align: center; }
  em { color: #990000; }
  a { color: #0645ad; }
  pre { background: #f4f4f4; padding: 6px; }
</style>
</head>
<body>
  <h1>Snapshot fixture</h1>
  <div class="box">A box with a <strong>bold</strong> word, an <em>italic</em> word, and a <a href="#">link</a>.
  This sentence is long enough to wrap onto a second line inside the box at this width.</div>
  <div class="row"><div>one</div><div>two</div><div>three</div></div>
  <ul><li>first item<li>second item</ul>
  <ol start="3"><li>third<li>fourth</ol>
  <pre>preformatted
   text</pre>
  <p style="text-align: center; text-decoration: underline">centered underlined</p>
</body>
</html>
