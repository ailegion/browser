[package]
name = "browser-paint"
description = "Turns layout fragments into a vello::Scene; decodes images; renders scenes offscreen for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
browser-dom.workspace = true
browser-layout.workspace = true
browser-style.workspace = true
vello.workspace = true
# SVG images: parsed by usvg, drawn through vello_svg.
usvg.workspace = true
vello_svg.workspace = true
# Glyph outlines for `background-clip: text`; the version vello uses.
skrifa.workspace = true
url.workspace = true
tracing.workspace = true
pollster.workspace = true
# Decoder set is provisional until the Phase 0 unsafe audit (plan O1).
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
