name: ci

# Automatic runs are off while the product is built (owner's call,
# 2026-09-26): each push was spending minutes for no reason. The workflow
# stays runnable by hand from the Actions tab. To turn it back on, restore
#   push:
#   pull_request:
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  policy:
    name: pure-rust policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: banned crates
        run: cargo deny --all-features check bans
      - name: no native build steps
        # A second line of defense behind deny.toml: nothing may need cc,
        # cmake, or pkg-config to build, on any of the three platforms.
        # Resolving for a target needs no toolchain for it.
        run: |
          fail=0
          for target in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            cargo tree -e build --all-features --target "$target" > "build-deps-$target.txt"
            if grep -Ei '^\s*[├└│ ]*(cc|cmake|pkg-config|vcpkg|bindgen) v' "build-deps-$target.txt"; then
              echo "native build dependency found for $target"; fail=1
            fi
          done
          exit $fail
      - name: workspace crates forbid unsafe
        run: |
          fail=0
          for f in crates/*/src/lib.rs crates/*/src/main.rs; do
            [ -f "$f" ] || continue
            case "$f" in crates/platform/*) continue;; esac
            grep -q '#!\[forbid(unsafe_code)\]' "$f" || { echo "missing forbid(unsafe_code): $f"; fail=1; }
          done
          exit $fail

  build:
    name: build and test (${{ matrix.os }})
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        # All three platforms from Phase 2 on (plan D12). One toolchain,
        # one build: nothing is compiled outside cargo on any of them.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: linux runtime libraries
        if: runner.os == 'Linux'
        # Runtime only, nothing here is compiled or linked at build time: a
        # software Vulkan device so the GPU tests run instead of skipping,
        # the keyboard library winit opens at runtime, and a virtual display
        # for the smoke render.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libxkbcommon0 xvfb
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: smoke render
        # Opens the window, renders one frame, exits. Windows uses the
        # WARP software adapter, macOS Metal; Linux needs the virtual
        # display above. Advisory: a runner without a usable adapter
        # must not fail the build.
        if: runner.os != 'Linux'
        run: cargo run -p browser-shell --locked -- --smoke
        continue-on-error: true
      - name: smoke render (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run -p browser-shell --locked -- --smoke
        continue-on-error: true

  unsafe-audit:
    name: unsafe baseline
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - name: count unsafe in parser dependencies
        run: |
          # geiger needs a concrete package; the shell depends on every other crate.
          # geiger also insists on an absolute manifest path.
          cargo geiger --manifest-path "$(pwd)/crates/shell/Cargo.toml" --output-format Ascii > geiger-report.txt || true
          cat geiger-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: geiger-report
          path: geiger-report.txt
